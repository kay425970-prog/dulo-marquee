appId: app.arkaflix.marquee
productName: arkaflix
copyright: Copyright © 2026 arkaflix

# The web app's package.json is private and version-less (it runs on Netlify),
# so inject the desktop metadata here rather than mutating it.
extraMetadata:
  version: 1.0.0
  description: "arkaflix — watch movies, shows, anime and live TV"
  author:
    name: arkaflix
    email: kay425970@gmail.com
  main: electron/main.cjs

directories:
  output: dist
  buildResources: electron/build

# Only ship the desktop shell — the web app is loaded from the deployed URL.
files:
  - electron/**/*
  - "!**/*.map"

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: electron/build/icon.ico
  artifactName: arkaflix-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: arkaflix
  installerIcon: electron/build/icon.ico
  uninstallerIcon: electron/build/icon.ico
  deleteAppDataOnUninstall: false

portable:
  artifactName: arkaflix-${version}-portable.${ext}

# Bonus targets so "all devices" is covered, not just Windows.
linux:
  target:
    - AppImage
  category: AudioVideo
  icon: electron/build/icon.png
  artifactName: arkaflix-${version}-${arch}.${ext}

mac:
  target:
    - dmg
  category: public.app-category.entertainment
  icon: electron/build/icon.png
  artifactName: arkaflix-${version}-${arch}.${ext}
