name: Build Android APK (phone + Android TV)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "scripts/patch-android-tv.mjs"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner ships with the Android SDK preinstalled. The
      # android-actions/setup-android action now fails because the legacy
      # "tools" package was removed, so configure the existing SDK directly.
      - name: Configure Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$ANDROID_HOME" ]; then export ANDROID_HOME="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          echo "sdkmanager: ${SDKMANAGER:-<none>}"
          if [ -n "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

          echo "platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: Install JS dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch for Android TV / Vitron (leanback + banner)
        run: node scripts/patch-android-tv.mjs

      - name: Set app version + label
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VERSION\"/" "$MANIFEST" || true
          sed -i 's/android:label="[^"]*"/android:label="dulo"/' "$MANIFEST" || true
          cat "$MANIFEST"

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (debug-signed, installable)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dulo-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
