name: Build Android APK (phone + Android TV)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.json"
      - "scripts/patch-android-tv.mjs"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch for Android TV / Vitron (leanback + banner)
        run: node scripts/patch-android-tv.mjs

      - name: Set app version + label
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VERSION\"/" "$MANIFEST" || true
          sed -i 's/android:label="[^"]*"/android:label="dulo"/' "$MANIFEST" || true
          cat "$MANIFEST"

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (debug-signed, installable)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dulo-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
